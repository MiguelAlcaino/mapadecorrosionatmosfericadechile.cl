mediciones:
  class: sfDoctrineRouteCollection
  options:
    model:                mediciones
    module:               mediciones
    prefix_path:          /mediciones
    column:               id
    with_wildcard_routes: true

fotos:
  class: sfDoctrineRouteCollection
  options:
    model:                Fotos
    module:               fotos
    prefix_path:          /fotos
    column:               id
    with_wildcard_routes: true

estacion:
  class: sfDoctrineRouteCollection
  options:
    model:                Estacion
    module:               estacion
    prefix_path:          /estacion
    column:               id
    with_wildcard_routes: true

# You can find more information about this file on the symfony website:
# http://www.symfony-project.org/reference/1_4/en/10-Routing

sf_guard_signin:
  url:   /login
  param: { module: sfGuardAuth, action: signin }

sf_guard_signout:
  url:   /logout
  param: { module: sfGuardAuth, action: signout }

sf_guard_password:
  url:   /request_password
  param: { module: sfGuardAuth, action: password }

# default rules
homepage:
  url:   /
  param: { module: mapa, action: index }

# generic rules
# please, remove them by adding more specific rules
default_index:
  url:   /:module
  param: { action: index }
#default_mapa:
#  url:   /
#  param: { module: mapa, action: mantencion }
default:
  url:   /:module/:action/*


