services:
  nginx:
    image: nginx:1.10          # match prod (1.10.3): tolerates the malformed header
    platform: linux/amd64      # from Symfony 1.4's /e-modifier bug on PHP 7.0
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/mapadecorrosionatmosfericadechile.cl
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    platform: linux/amd64
    volumes:
      - .:/var/www/mapadecorrosionatmosfericadechile.cl
    depends_on:
      - db

  db:
    image: mysql:5.7
    platform: linux/amd64
    command: --sql_mode=NO_ENGINE_SUBSTITUTION   # relax STRICT/ONLY_FULL_GROUP_BY for the old app
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mapadeco_innova
      MYSQL_USER: mapadeco
      MYSQL_PASSWORD: mapadeco
    ports:
      - "3307:3306"
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
