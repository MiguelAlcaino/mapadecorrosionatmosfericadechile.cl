# Adapted verbatim from the DigitalOcean server vhost.
# Only change vs production: fastcgi_pass points to the php-fpm container (php:9000)
# instead of the unix socket. Paths (root, SCRIPT_FILENAME) are kept identical to
# prod because the project is mounted at the same path in both containers.
server {
    listen       80;
    server_name  mapadecorrosionatmosfericadechile.cl www.mapadecorrosionatmosfericadechile.cl localhost;

    access_log   /dev/stdout;
    error_log    /dev/stderr;

    root   /var/www/mapadecorrosionatmosfericadechile.cl/public_html;
    index  index.php;

    charset utf-8;

    location / {
            # If the file exists as a static file serve it directly without
            # running all the other rewite tests on it
            if (-f $request_filename) {
                    expires max;
                    break;
            }

            if ($request_filename !~ "\.(js|htc|ico|gif|jpg|png|css)$") {
                    rewrite ^(.*) /index.php last;
            }
    }

    location ~ \.php($|/) {
            set  $script     $uri;
            set  $path_info  "";

            if ($uri ~ "^(.+\.php)(/.+)") {
                    set  $script     $1;
                    set  $path_info  $2;
            }

            fastcgi_pass   php:9000;
            #fastcgi_pass 127.0.0.1:9000;

            include fastcgi_params;

            fastcgi_param  SCRIPT_FILENAME /var/www/mapadecorrosionatmosfericadechile.cl/public_html$script;
            fastcgi_param  PATH_INFO        $path_info;
            fastcgi_param SCRIPT_NAME $script;
    }
}
